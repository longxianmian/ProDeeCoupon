<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 登录测试 - ProDee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .info-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    
    .info-box h3 {
      color: #667eea;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .info-box ul {
      list-style: none;
      padding-left: 0;
    }
    
    .info-box li {
      padding: 5px 0;
      color: #555;
      font-size: 14px;
    }
    
    .info-box li::before {
      content: "✓ ";
      color: #28a745;
      font-weight: bold;
      margin-right: 8px;
    }
    
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #06C755;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .btn:hover {
      background: #05b34a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.4);
    }
    
    .btn.secondary {
      background: #6c757d;
    }
    
    .btn.secondary:hover {
      background: #5a6268;
    }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .status.loading {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .user-info {
      margin-top: 15px;
      padding: 15px;
      background: #e7f3ff;
      border-radius: 8px;
    }
    
    .user-info pre {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 LINE 登录测试</h1>
    <p class="subtitle">测试无状态 state + PKCE 登录方案</p>
    
    <div class="info-box">
      <h3>✨ 新方案特性</h3>
      <ul>
        <li>签名的无状态 state（不依赖预会话 Cookie）</li>
        <li>数据库存储 code_verifier（防重放攻击）</li>
        <li>只在登录成功后设置会话 Cookie</li>
        <li>完美适配 LINE 浏览器严格环境</li>
      </ul>
    </div>
    
    <a href="/auth/line/login" class="btn">
      🚀 开始 LINE 登录
    </a>
    
    <button onclick="checkSession()" class="btn secondary">
      🔍 检查登录状态
    </button>
    
    <button onclick="logout()" class="btn secondary">
      👋 退出登录
    </button>
    
    <div id="status"></div>
  </div>

  <script>
    // 检查登录状态
    async function checkSession() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = '⏳ 正在检查登录状态...';
      
      try {
        const response = await fetch('/api/me', {
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok && data.ok) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `
            <strong>✅ 已登录</strong>
            <div class="user-info">
              <strong>用户信息：</strong>
              <pre>${JSON.stringify(data.user, null, 2)}</pre>
            </div>
          `;
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `
            <strong>❌ 未登录</strong><br>
            错误: ${data.error || '未知错误'}
          `;
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `
          <strong>❌ 请求失败</strong><br>
          ${error.message}
        `;
      }
    }
    
    // 退出登录
    async function logout() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = '⏳ 正在退出登录...';
      
      try {
        const response = await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        
        if (response.ok) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = '✅ 已成功退出登录';
        } else {
          throw new Error('退出失败');
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `❌ 退出失败: ${error.message}`;
      }
    }
    
    // 页面加载时自动检查登录状态
    window.addEventListener('load', checkSession);
  </script>
</body>
</html>
