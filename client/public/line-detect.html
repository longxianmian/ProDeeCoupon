<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"="width=device-width, initial-scale=1.0">
  <title>LINE环境检测 - ProDee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .result {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    
    .result h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #fbbf24;
    }
    
    .result pre {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.6;
      font-family: 'Courier New', monospace;
    }
    
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .status.yes {
      background: #10b981;
    }
    
    .status.no {
      background: #ef4444;
    }
    
    .btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
    }
    
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 LINE环境检测诊断</h1>
    
    <div id="results"></div>
    
    <button class="btn" onclick="testLogin()">🚀 测试方案A登录</button>
  </div>

  <script>
    const results = document.getElementById('results');
    
    function addResult(title, content, isGood = null) {
      const div = document.createElement('div');
      div.className = 'result';
      
      let statusHTML = '';
      if (isGood !== null) {
        statusHTML = `<span class="status ${isGood ? 'yes' : 'no'}">${isGood ? '✅ 是' : '❌ 否'}</span>`;
      }
      
      div.innerHTML = `
        <h3>${title}</h3>
        ${statusHTML}
        <pre>${content}</pre>
      `;
      results.appendChild(div);
    }
    
    // 检测环境
    function detectEnvironment() {
      const ua = navigator.userAgent;
      
      // 1. User-Agent
      addResult('User-Agent', ua);
      
      // 2. User-Agent包含Line?
      const hasLine = /Line/i.test(ua);
      addResult('User-Agent包含"Line"关键字？', hasLine ? '是，应该会触发方案A' : '否，会使用OAuth备选方案', hasLine);
      
      // 3. User-Agent包含LIFF?
      const hasLIFF = /LIFF/i.test(ua);
      addResult('User-Agent包含"LIFF"关键字？', hasLIFF ? '是' : '否', hasLIFF);
      
      // 4. window.liff存在?
      const hasLiffObject = !!window.liff;
      addResult('window.liff对象存在？', hasLiffObject ? '是' : '否', hasLiffObject);
      
      // 5. Referrer
      addResult('Referrer', document.referrer || '(空)');
      
      // 6. 综合判断
      const isInLINE = hasLine || hasLIFF || hasLiffObject || (document.referrer && document.referrer.includes('line.me'));
      addResult('✨ 最终判断：是否在LINE环境？', isInLINE ? '✅ 是 - 应该触发方案A PKCE登录' : '❌ 否 - 会使用OAuth备选登录', isInLINE);
      
      // 7. 其他信息
      addResult('当前URL', window.location.href);
      addResult('平台', navigator.platform || 'Unknown');
      addResult('语言', navigator.language || 'Unknown');
      
      // 8. sessionStorage中的afterLogin
      const afterLogin = sessionStorage.getItem('afterLogin');
      addResult('sessionStorage.afterLogin', afterLogin || '(未设置)');
    }
    
    function testLogin() {
      // 保存当前页面路径
      const currentPath = window.location.pathname + window.location.search;
      sessionStorage.setItem('afterLogin', currentPath);
      
      // 跳转到方案A登录入口
      alert('即将跳转到方案A登录入口：/login\n\n如果正常，应该会看到LINE授权页面');
      window.location.href = '/login';
    }
    
    // 页面加载时自动检测
    detectEnvironment();
  </script>
</body>
</html>
