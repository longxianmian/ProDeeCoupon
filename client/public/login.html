<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 登录 - ProDee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
    }
    
    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }
    
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎫</div>
    <h1>LINE 登录</h1>
    <p>正在跳转到 LINE 授权页面...</p>
    <div class="spinner"></div>
  </div>

  <script>
    (function() {
      // 读取 sessionStorage 中保存的登录后跳转路径
      const afterLogin = sessionStorage.getItem('afterLogin') || '/';
      
      // 构建登录URL
      const loginUrl = '/auth/line/start?return=' + encodeURIComponent(afterLogin);
      
      console.log('🚀 [方案A] 开始LINE登录流程');
      console.log('📍 登录后将返回:', afterLogin);
      
      // 立即跳转到后端PKCE登录入口
      window.location.href = loginUrl;
    })();
  </script>
</body>
</html>
